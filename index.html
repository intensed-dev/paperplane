<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paperplane</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{min-height:100svh;overflow:hidden}.app{height:100svh;display:flex;flex-direction:column}.top{padding:max(12px,env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:21px;letter-spacing:-.055em}.workspace{flex:1;min-height:0;display:grid;place-items:center;padding:10px 12px}.stage{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:16px;background:#151515;box-shadow:0 16px 50px rgba(0,0,0,.35)}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.empty{height:100%;width:100%;display:grid;place-items:center;text-align:center;padding:30px}.empty i{font-size:40px;margin-bottom:16px}.bottom{padding:7px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:5px;border-top:1px solid #151515;background:#000}.tool{border:0;background:transparent;color:#929292;min-width:58px;padding:8px 6px;font-size:10px;font-weight:600}.tool i{display:block;font-size:20px;margin-bottom:5px}.tool.active,.tool:hover{color:#fff}.primary{background:#fff;color:#000;border-radius:999px;padding:12px 20px;font-weight:750;border:0}.sheet{position:fixed;inset:auto 0 0;background:#151515;border-radius:24px 24px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:10;box-shadow:0 -15px 45px rgba(0,0,0,.35);max-height:72svh;overflow:auto}.sheet.open{transform:translateY(0)}.sheet-title{font-size:17px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sticker{aspect-ratio:1;border:0;border-radius:14px;background:#242424;font-size:27px;display:grid;place-items:center}.text-input,.select{width:100%;background:#242424;border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:12px;outline:none}.select{appearance:none}.row{display:flex;gap:8px;align-items:center}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #555}.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px #000}.toggle{width:44px;height:26px;border-radius:99px;background:#3a3a3a;border:0;position:relative}.toggle:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:#fff}.toggle.on:after{left:21px;background:#000}.overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(var(--scale,1));user-select:none;touch-action:none;cursor:grab;white-space:pre}.overlay.text{font-size:32px;font-weight:750;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.5)}.overlay.sticker{font-size:48px}.overlay.selected{outline:1px solid rgba(255,255,255,.7);outline-offset:8px}.watermark{position:absolute;bottom:6px;left:8px;right:8px;text-align:center;font-size:9px;color:#fff;background:rgba(0,0,0,.5);padding:4px;border-radius:6px;pointer-events:none}.editbar{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:8;background:rgba(22,22,22,.92);backdrop-filter:blur(18px);border:1px solid #303030;border-radius:16px;padding:6px;display:none;gap:4px}.editbar.open{display:flex}.editbar button{width:40px;height:40px;border:0;background:transparent;color:#fff;border-radius:11px}.editbar button:active{background:#333}.hidden{display:none!important}@media(min-width:700px){.workspace{padding:18px}.stage{max-height:calc(100svh - 130px)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><span class="brand">paperplane</span><button id="closeBtn" class="tool hidden" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></header>
<main class="workspace"><div id="stage" class="stage"><div class="empty"><div><i class="fa-regular fa-image"></i><h1 class="text-xl font-semibold">Create something</h1><p class="text-sm text-neutral-400 mt-1">Choose a photo to start editing.</p><button id="pick" class="primary mt-5"><i class="fa-solid fa-plus mr-1"></i>Add photo</button></div></div></div></main>
<nav class="bottom"><button class="tool" id="gallery"><i class="fa-regular fa-images"></i>Photos</button><button class="tool" id="stickers"><i class="fa-regular fa-face-smile"></i>Stickers</button><button class="tool" id="addText"><i class="fa-solid fa-t"></i>Text</button><button class="tool" id="download"><i class="fa-solid fa-arrow-down"></i>Save</button></nav>
</div>
<div id="editbar" class="editbar"><button id="rotateLeft" aria-label="Rotate left"><i class="fa-solid fa-rotate-left"></i></button><button id="rotateRight" aria-label="Rotate right"><i class="fa-solid fa-rotate-right"></i></button><button id="deleteOverlay" aria-label="Delete"><i class="fa-regular fa-trash-can"></i></button></div>
<input id="file" type="file" accept="image/*" hidden>
<section id="stickerSheet" class="sheet"><div class="flex items-center justify-between mb-4"><span class="sheet-title">Stickers</span><button class="tool" onclick="closeSheets()"><i class="fa-solid fa-xmark"></i></button></div><div class="grid" id="stickerGrid"></div></section>
<section id="textSheet" class="sheet"><div class="flex items-center justify-between mb-4"><span class="sheet-title">Text</span><button class="tool" onclick="closeSheets()"><i class="fa-solid fa-xmark"></i></button></div><input id="textInput" class="text-input" placeholder="Type something…" maxlength="80"><div class="row mt-3"><select id="fontSelect" class="select"></select></div><div class="flex items-center justify-between mt-4"><span class="text-sm font-semibold">Color</span><div id="swatches" class="swatches"></div></div><div class="flex items-center justify-between mt-4"><span class="text-sm font-semibold">Background</span><button id="bgToggle" class="toggle" aria-label="Text background"></button></div><div id="bgOptions" class="hidden mt-3"><div class="swatches" id="bgSwatches"></div></div><button id="textConfirm" class="primary w-full mt-4">Add text</button></section>
<script>
const file=document.querySelector('#file'),stage=document.querySelector('#stage'),pick=document.querySelector('#pick'),editbar=document.querySelector('#editbar');let image=null,selected=null;
const stickers=['⭐','❤️','✨','🔥','💫','🌈','☀️','🌙','🦋','🌸','🍀','🎀','😎','🥹','😂','🤍','💜','🩵','🍓','🍋','🍒','🌿','🪩','🎧'];
const fonts=['Inter','Arial','Georgia','Times New Roman','Courier New','Impact','Trebuchet MS','Verdana','Palatino Linotype','Comic Sans MS','Brush Script MT','serif','sans-serif','monospace'];
const colors=['#ffffff','#000000','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#5856d6','#af52de','#ff2d55'];
function openFile(){file.click()}pick?.addEventListener('click',openFile);document.querySelector('#gallery').onclick=openFile;
file.onchange=e=>{const f=e.target.files[0];if(!f)return;loadImage(URL.createObjectURL(f))};
function loadImage(url){stage.innerHTML=`<img id="photo" src="${url}" alt="Selected photo"><div id="overlays"></div><div class="watermark">made with intensed-dev.github.io/paperplane</div>`;image=document.querySelector('#photo');document.querySelector('#closeBtn').classList.remove('hidden');image.onload=fitStage}
function fitStage(){stage.style.aspectRatio=`${image.naturalWidth}/${image.naturalHeight}`}
function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'))}
function selectOverlay(el){if(selected)selected.classList.remove('selected');selected=el;el.classList.add('selected');editbar.classList.add('open')}
function addOverlay(value,kind,options={}){if(!image)return;const el=document.createElement('div');el.className=`overlay ${kind}`;el.textContent=value;el.style.left='50%';el.style.top='50%';el.dataset.x=.5;el.dataset.y=.5;el.dataset.scale=options.scale||1;el.dataset.rot=0;el.style.setProperty('--scale',el.dataset.scale);el.style.setProperty('--rot','0deg');if(kind==='text'){el.style.color=options.color||'#fff';el.style.fontFamily=options.font||'Inter';if(options.background){el.style.background=options.backgroundColor||'#fff';el.style.color=options.backgroundTextColor||'#000';el.style.padding='6px 10px';el.style.borderRadius='8px'}}document.querySelector('#overlays').append(el);selectOverlay(el);attachGestures(el)}
function attachGestures(el){let dragging=false,sx=0,sy=0,startX=0,startY=0,pinch=false,startDist=0,startScale=1,startAngle=0,startRot=0;
el.addEventListener('pointerdown',e=>{e.stopPropagation();selectOverlay(el);el.setPointerCapture(e.pointerId);dragging=true;sx=e.clientX;sy=e.clientY;startX=el.offsetLeft;startY=el.offsetTop});
el.addEventListener('pointermove',e=>{if(!dragging)return;el.style.left=startX+e.clientX-sx+'px';el.style.top=startY+e.clientY-sy+'px'});
el.addEventListener('pointerup',()=>dragging=false);el.addEventListener('dblclick',()=>removeOverlay(el));
let pts=new Map();el.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);if(pts.size===2){dragging=false;const a=[...pts.values()];startDist=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);startAngle=Math.atan2(a[1].clientY-a[0].clientY,a[1].clientX-a[0].clientX);startScale=Number(el.dataset.scale);startRot=Number(el.dataset.rot);pinch=true}});el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const a=[...pts.values()];const dist=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);const angle=Math.atan2(a[1].clientY-a[0].clientY,a[1].clientX-a[0].clientX);if(pinch){el.dataset.scale=Math.max(.35,Math.min(4,startScale*dist/startDist));el.dataset.rot=startRot+(angle-startAngle)*180/Math.PI;el.style.setProperty('--scale',el.dataset.scale);el.style.setProperty('--rot',el.dataset.rot+'deg')}}});el.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=false});el.addEventListener('pointercancel',e=>pts.delete(e.pointerId))}
function removeOverlay(el){if(selected===el){selected=null;editbar.classList.remove('open')}el.remove()}
const sg=document.querySelector('#stickerGrid');stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{addOverlay(s,'sticker');closeSheets()};sg.append(b)});
const fs=document.querySelector('#fontSelect');fonts.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;o.style.fontFamily=f;fs.append(o)});
let textColor='#fff',bgColor='#fff',bgOn=false;const sw=document.querySelector('#swatches');colors.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c==='#ffffff'?' selected':'');b.style.background=c;b.onclick=()=>{textColor=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};sw.append(b)});const bgs=document.querySelector('#bgSwatches');['#fff','#000','#ff3b30','#ff9500','#34c759','#007aff','#5856d6','#af52de'].forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>bgColor=c;bgs.append(b)});
document.querySelector('#bgToggle').onclick=e=>{bgOn=!bgOn;e.currentTarget.classList.toggle('on',bgOn);document.querySelector('#bgOptions').classList.toggle('hidden',!bgOn)};
document.querySelector('#stickers').onclick=()=>{closeSheets();document.querySelector('#stickerSheet').classList.add('open')};document.querySelector('#addText').onclick=()=>{closeSheets();document.querySelector('#textSheet').classList.add('open');document.querySelector('#textInput').focus()};document.querySelector('#textConfirm').onclick=()=>{const v=document.querySelector('#textInput').value.trim();if(v)addOverlay(v,'text',{font:fs.value,color:textColor,background:bgOn?bgColor:null,backgroundColor:bgColor,backgroundTextColor:bgColor==='#000'?'#fff':'#000'});document.querySelector('#textInput').value='';closeSheets()};
document.querySelector('#closeBtn').onclick=()=>location.reload();document.querySelector('#deleteOverlay').onclick=()=>selected&&removeOverlay(selected);document.querySelector('#rotateLeft').onclick=()=>selected&&rotate(-15);document.querySelector('#rotateRight').onclick=()=>selected&&rotate(15);function rotate(d){const r=Number(selected.dataset.rot||0)+d;selected.dataset.rot=r;selected.style.setProperty('--rot',r+'deg')}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.overlay')&&!e.target.closest('.editbar')){if(selected)selected.classList.remove('selected');selected=null;editbar.classList.remove('open')}});
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function loadFont(font){if(!document.fonts)return;try{await document.fonts.load(`32px "${font}"`)}catch{} }
async function exportImage(){if(!image)return alert('Add a photo first.');const max=2400,scale=Math.min(1,max/image.naturalWidth),w=Math.round(image.naturalWidth*scale),h=Math.round(image.naturalHeight*scale),footer=54;const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h+footer;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(image,0,0,w,h);const ir=image.getBoundingClientRect(),sr=stage.getBoundingClientRect();for(const o of document.querySelectorAll('.overlay')){const ox=o.offsetLeft,oy=o.offsetTop;const x=(ox-(ir.left-sr.left))*scale,y=(oy-(ir.top-sr.top))*scale,s=Number(o.dataset.scale||1),r=Number(o.dataset.rot||0)*Math.PI/180;ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';if(o.classList.contains('text')){const size=32;ctx.font=`750 ${size}px "${o.style.fontFamily||'Inter'}"`;const metrics=ctx.measureText(o.textContent);if(o.style.backgroundColor){const padX=10,padY=6;ctx.fillStyle=o.style.backgroundColor;roundRect(ctx,-metrics.width/2-padX,-size/2-padY,metrics.width+padX*2,size+padY*2,8);ctx.fill()}ctx.fillStyle=o.style.color||'#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.fillText(o.textContent,0,0)}else{ctx.font='48px sans-serif';ctx.fillText(o.textContent,0,0)}ctx.restore();}ctx.fillStyle='#fff';ctx.fillRect(0,h,w,footer);ctx.fillStyle='#111';ctx.font='700 18px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('made with intensed-dev.github.io/paperplane',w/2,h+footer/2);canvas.toBlob(blob=>{const a=document.createElement('a');a.download='paperplane.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}
document.querySelector('#download').onclick=exportImage;
</script>
</body></html>
