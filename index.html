<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paperplane</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app">
<header class="top"><button id="backBtn" class="icon-btn hidden" aria-label="Deselect"><i class="fa-solid fa-chevron-left"></i></button><span class="brand">paperplane</span><div class="top-actions"><button id="undoBtn" class="icon-btn" aria-label="Undo"><i class="fa-solid fa-arrow-rotate-left"></i></button><button id="redoBtn" class="icon-btn" aria-label="Redo"><i class="fa-solid fa-arrow-rotate-right"></i></button><button id="closeBtn" class="icon-btn hidden" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div></header>
<main class="workspace"><div id="stage" class="stage"><div class="empty"><div><i class="fa-regular fa-images"></i><h1>Create something</h1><p>Choose a photo to start editing.</p><button id="pick" class="primary"><i class="fa-solid fa-plus"></i>Add photo</button></div></div></div></main>
<nav class="bottom" aria-label="Editor tools"><button class="tool" id="gallery"><i class="fa-regular fa-images"></i><span>Photos</span></button><button class="tool" id="stickers"><i class="fa-regular fa-face-smile"></i><span>Sticker</span></button><button class="tool" id="addText"><i class="fa-solid fa-font"></i><span>Text</span></button><button class="tool" id="adjust"><i class="fa-solid fa-sliders"></i><span>Adjust</span></button><button class="tool" id="download"><i class="fa-solid fa-arrow-down-to-bracket"></i><span>Save</span></button></nav>
</div>
<input id="file" type="file" accept="image/*" hidden>
<section id="stickerSheet" class="sheet"><div class="sheet-head"><b>Stickers</b><button class="icon-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><div class="sheet-search"><i class="fa-solid fa-magnifying-glass"></i><input id="stickerSearch" placeholder="Search stickers" aria-label="Search stickers"></div><div class="sticker-grid" id="stickerGrid"></div></section>
<section id="textSheet" class="sheet"><div class="sheet-head"><b id="textSheetTitle">Text</b><button class="icon-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><input id="textInput" class="field" placeholder="Type something…" maxlength="80"><div class="section-label">Font</div><div class="font-grid" id="fontGrid"></div><div class="section-label">Color</div><div class="swatches" id="textColors"></div><div class="section-label row-label"><span>Background</span><button id="bgToggle" class="switch" aria-label="Text background"></button></div><div id="bgOptions" class="hidden"><div class="swatches" id="bgColors"></div></div><button id="textConfirm" class="primary wide">Add text</button></section>
<section id="adjustSheet" class="sheet"><div class="sheet-head"><b>Adjust</b><button class="icon-btn" data-close><i class="fa-solid fa-xmark"></i></button></div><div class="section-label">Filters</div><div class="filter-grid" id="filterGrid"></div><div class="section-label">Light & color</div><label class="range-label">Brightness <output id="brightnessOut">100%</output><input id="brightness" type="range" min="0" max="200" value="100"></label><label class="range-label">Contrast <output id="contrastOut">100%</output><input id="contrast" type="range" min="0" max="200" value="100"></label><label class="range-label">Saturation <output id="saturationOut">100%</output><input id="saturation" type="range" min="0" max="200" value="100"></label><label class="range-label">Blur <output id="blurOut">0px</output><input id="blur" type="range" min="0" max="12" value="0"></label><div class="adjust-actions"><button id="rotatePhoto" class="secondary"><i class="fa-solid fa-rotate-right"></i> Rotate</button><button id="flipPhoto" class="secondary"><i class="fa-solid fa-arrows-left-right"></i> Flip</button><button id="resetAdjust" class="secondary"><i class="fa-solid fa-arrow-rotate-left"></i> Reset</button></div></section>
<div id="editbar" class="editbar"><button id="editOverlay" aria-label="Edit"><i class="fa-solid fa-pen"></i></button><button id="rotateLeft" aria-label="Rotate left"><i class="fa-solid fa-rotate-left"></i></button><button id="rotateRight" aria-label="Rotate right"><i class="fa-solid fa-rotate-right"></i></button><button id="deleteOverlay" aria-label="Delete"><i class="fa-regular fa-trash-can"></i></button></div>
<script src="src/app.js"></script>
</body></html>
