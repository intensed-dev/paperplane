<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Paperplane</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}body{min-height:100svh;overflow:hidden}.app{height:100svh;display:flex;flex-direction:column}.top{padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:20px;letter-spacing:-.04em}.workspace{flex:1;min-height:0;display:grid;place-items:center;padding:12px}.stage{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#151515}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.empty{height:100%;width:100%;display:grid;place-items:center;text-align:center;padding:30px}.empty i{font-size:42px;margin-bottom:16px}.bottom{padding:10px 14px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:8px}.tool{border:0;background:transparent;color:#aaa;min-width:56px;padding:9px 7px;font-size:11px}.tool i{display:block;font-size:20px;margin-bottom:5px}.tool.active,.tool:hover{color:#fff}.primary{background:#fff;color:#000;border-radius:999px;padding:12px 20px;font-weight:700;border:0}.sheet{position:fixed;inset:auto 0 0;background:#151515;border-radius:22px 22px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));transform:translateY(105%);transition:.25s;z-index:5}.sheet.open{transform:translateY(0)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sticker{aspect-ratio:1;border:0;border-radius:12px;background:#242424;font-size:27px}.text-input{width:100%;background:#242424;border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:12px}.overlay{position:absolute;transform:translate(-50%,-50%);user-select:none;touch-action:none;cursor:grab}.overlay.text{font-size:32px;font-weight:700;text-shadow:0 2px 8px #000}.overlay.sticker{font-size:48px}.watermark{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:8px;color:#fff;background:rgba(0,0,0,.45);padding:3px}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><span class="brand">paperplane</span><button id="closeBtn" class="tool" hidden><i class="fa-solid fa-xmark"></i></button></header>
  <main class="workspace"><div id="stage" class="stage"><div class="empty"><div><i class="fa-regular fa-image"></i><h1 class="text-xl font-semibold">Create something</h1><p class="text-sm text-neutral-400 mt-1">Choose a photo to start editing.</p><button id="pick" class="primary mt-5"><i class="fa-solid fa-plus mr-1"></i> Add photo</button></div></div></div></main>
  <nav class="bottom"><button class="tool" id="gallery"><i class="fa-regular fa-images"></i>Photos</button><button class="tool" id="stickers"><i class="fa-regular fa-face-smile"></i>Stickers</button><button class="tool" id="addText"><i class="fa-solid fa-t"></i>Text</button><button class="tool" id="download"><i class="fa-solid fa-arrow-down"></i>Save</button></nav>
</div>
<input id="file" type="file" accept="image/*" hidden>
<section id="stickerSheet" class="sheet"><div class="flex items-center justify-between mb-4"><b>Stickers</b><button class="tool" onclick="closeSheets()"><i class="fa-solid fa-xmark"></i></button></div><div class="grid" id="stickerGrid"></div></section>
<section id="textSheet" class="sheet"><div class="flex items-center justify-between mb-4"><b>Add text</b><button class="tool" onclick="closeSheets()"><i class="fa-solid fa-xmark"></i></button></div><input id="textInput" class="text-input" placeholder="Type something…" maxlength="80"><button id="textConfirm" class="primary w-full mt-3">Add text</button></section>
<script>
const file=document.querySelector('#file'),stage=document.querySelector('#stage'),pick=document.querySelector('#pick');let image=null;
const stickers=['⭐','❤️','✨','🔥','💫','🌈','☀️','🌙','🦋','🌸','🍀','🎀','😎','🥹','😂','🤍','💜','🩵'];
function openFile(){file.click()} pick?.addEventListener('click',openFile);document.querySelector('#gallery').onclick=openFile;file.onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);loadImage(url)};
function loadImage(url){stage.innerHTML=`<img id="photo" src="${url}" alt="Selected photo"><div id="overlays"></div>`;image=document.querySelector('#photo');document.querySelector('#closeBtn').hidden=false;image.onload=fitStage}
function fitStage(){stage.style.aspectRatio=`${image.naturalWidth}/${image.naturalHeight}`}
function closeSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'))}
function addOverlay(value,kind){if(!image)return;const el=document.createElement('div');el.className=`overlay ${kind}`;el.textContent=value;el.style.left='50%';el.style.top='50%';document.querySelector('#overlays').append(el);drag(el)}
function drag(el){let down=false,sx,sy,ox,oy;el.addEventListener('pointerdown',e=>{down=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop});el.addEventListener('pointermove',e=>{if(!down)return;el.style.left=ox+e.clientX-sx+'px';el.style.top=oy+e.clientY-sy+'px'});el.addEventListener('pointerup',()=>down=false);el.addEventListener('dblclick',()=>el.remove())}
const sg=document.querySelector('#stickerGrid');stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{addOverlay(s,'sticker');closeSheets()};sg.append(b)});
document.querySelector('#stickers').onclick=()=>{closeSheets();document.querySelector('#stickerSheet').classList.add('open')};document.querySelector('#addText').onclick=()=>{closeSheets();document.querySelector('#textSheet').classList.add('open');document.querySelector('#textInput').focus()};document.querySelector('#textConfirm').onclick=()=>{const v=document.querySelector('#textInput').value.trim();if(v)addOverlay(v,'text');document.querySelector('#textInput').value='';closeSheets()};document.querySelector('#closeBtn').onclick=()=>location.reload();
document.querySelector('#download').onclick=()=>{if(!image)return alert('Add a photo first.');const canvas=document.createElement('canvas'),scale=Math.min(1,2400/image.naturalWidth);canvas.width=image.naturalWidth*scale;canvas.height=image.naturalHeight*scale+24;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height-24);const overlays=[...document.querySelectorAll('.overlay')];const rect=stage.getBoundingClientRect(),ir=image.getBoundingClientRect();overlays.forEach(o=>{const x=(o.offsetLeft-(ir.left-rect.left))*scale;const y=(o.offsetTop-(ir.top-rect.top))*scale;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=o.classList.contains('text')?'700 32px -apple-system, sans-serif':'48px sans-serif';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.fillText(o.textContent,x,y);ctx.restore()});ctx.fillStyle='#fff';ctx.fillRect(0,canvas.height-24,canvas.width,24);ctx.fillStyle='#000';ctx.font='700 9px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillText('made with intensed-dev.github.io/paperplane',canvas.width/2,canvas.height-9);const a=document.createElement('a');a.download='paperplane.png';a.href=canvas.toDataURL('image/png');a.click()};
</script>
</body></html>
